name: Deploy to GitHub Pages

on:
  # Trigger on every push to the main branch
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Grant permissions needed to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid running two deployments at once
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Type-check every page and component first: if it fails, nothing is
  # built or deployed, so broken code never reaches the live site
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The checker is installed for this run only, package.json stays as is
      - name: Install astro check
        run: npm install --no-save @astrojs/check typescript
      - name: Type-check Astro files
        run: npx astro check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install dependencies, build site, and upload artifact
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
